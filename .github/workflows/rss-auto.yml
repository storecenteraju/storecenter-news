name: Store Center RSS Auto

on:
  schedule:
    # 10 execuções diárias, separadas por 2h24. Cada execução publica no máximo 1 matéria.
    # Horários de Brasília: 00:00, 02:24, 04:48, 07:12, 09:36,
    # 12:00, 14:24, 16:48, 19:12 e 21:36 (cron sempre usa UTC).
    - cron: "36 0 * * *"
    - cron: "0 3 * * *"
    - cron: "24 5 * * *"
    - cron: "48 7 * * *"
    - cron: "12 10 * * *"
    - cron: "36 12 * * *"
    - cron: "0 15 * * *"
    - cron: "24 17 * * *"
    - cron: "48 19 * * *"
    - cron: "12 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem publicar"
        required: false
        default: true
        type: boolean

permissions:
  contents: write

concurrency:
  group: storecenter-rss-auto
  cancel-in-progress: false

jobs:
  rss-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Gerar uma matéria a partir do RSS
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          STATIC_PUBLISH_MODE: "true"
          RSS_MAX_POSTS_PER_RUN: "1"
          RSS_ENABLE_AI_IMAGE_GENERATION: "false"
          RSS_DEFAULT_IMAGE_POLICY: "reference_only"
        run: npm run rss:static

      - name: Validar e montar o site estático
        run: |
          npm run lint
          npm run build:web

      - name: Salvar a matéria no GitHub
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "Store Center RSS"
          git config user.email "storecenteraju@users.noreply.github.com"
          git add db.json
          if git diff --cached --quiet; then
            echo "Nenhuma matéria inédita para salvar."
            exit 0
          fi
          git commit -m "Publica matéria automática do RSS"
          git push origin HEAD:main

      - name: Instalar cliente de publicação segura
        run: sudo apt-get update && sudo apt-get install -y lftp

      - name: Publicar no endereço de teste
        env:
          FTP_SERVER: ${{ secrets.CPANEL_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.CPANEL_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          test -n "$FTP_SERVER"
          test -n "$FTP_USERNAME"
          test -n "$FTP_PASSWORD"
          lftp -c "set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes; open -u \"$FTP_USERNAME\",\"$FTP_PASSWORD\" \"$FTP_SERVER\"; mirror --reverse --delete --verbose dist/ ./"
