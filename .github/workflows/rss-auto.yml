name: Store Center RSS Auto

on:
  schedule:
    # 10 execuções diárias, separadas por 2h24. Cada execução publica no máximo 1 matéria.
    # Horários de Brasília: 00:00, 02:24, 04:48, 07:12, 09:36,
    # 12:00, 14:24, 16:48, 19:12 e 21:36 (cron sempre usa UTC).
    - cron: "36 0 * * *"
    - cron: "0 3 * * *"
    - cron: "24 5 * * *"
    - cron: "48 7 * * *"
    - cron: "12 10 * * *"
    - cron: "36 12 * * *"
    - cron: "0 15 * * *"
    - cron: "24 17 * * *"
    - cron: "48 19 * * *"
    - cron: "12 22 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simular sem publicar"
        required: false
        default: true
        type: boolean

permissions: {}

concurrency:
  group: storecenter-rss-auto
  cancel-in-progress: false

jobs:
  rss-auto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Executar RSS automático do Store Center
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          test -n "$CRON_SECRET"
          endpoint="https://www.storecenter.com.br/api/cron/rss-auto"
          if [ "$DRY_RUN" = "true" ]; then
            endpoint="$endpoint?dryRun=true"
          fi
          curl --location --fail --show-error --silent \
            --retry 2 --retry-all-errors --max-time 1100 \
            --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$endpoint"
